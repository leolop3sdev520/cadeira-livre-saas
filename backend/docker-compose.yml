services:
  db:
    image: postgres:16-alpine
    container_name: cadeira-livre-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadeira_livre
      POSTGRES_PASSWORD: cadeira_livre
      POSTGRES_DB: cadeira_livre
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - cadeira_livre_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadeira_livre -d cadeira_livre"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cadeira_livre_pgdata:
